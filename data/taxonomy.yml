# 분야별 방식(schemes)·가속 연산(ops) 이름표와 공통 시스템 관점 최적화(sys_opts).
# papers.yml 의 scheme·ops·sys_opt 칸은 여기 key 만 쓴다. field ntt 는 pqc 이름표를 쓴다.
# load: 그 방식에서 시간을 많이 쓰는 연산. 근거 논문이 있으면 괄호로 적고, 비율을 확인하지 못했으면 그렇게 적는다.
# PQC·FHE 의 load 는 방식 명세·구현 구조에서 나온 정성 서술이다(측정 비율 아님).
# zkp schemes 의 pq: 양자 내성 — plausible(그럴듯함: 해시·부호 기반, 증명된 안전성은 아님)·no(타원곡선 기반이라 양자 공격에 깨짐)·depends(체계에 따름)
fields:
  pqc:
    schemes:
    - key: ml-kem
      label: ML-KEM (Kyber)
      load: NTT 다항식 곱(16비트 계수, q=3329)과 Keccak(SHAKE) 기반 행렬 확장·잡음 샘플링이 주된 연산이다
    - key: ml-dsa
      label: ML-DSA (Dilithium)
      load: NTT 다항식 곱(32비트 계수)과 SHAKE 기반 행렬 확장·샘플링, 서명은 거절 반복으로 이 과정을 여러 번 돈다
    - key: falcon
      label: Falcon·NTRU 격자 서명
      load: 서명은 부동소수 FFT 위 재귀 가우스 샘플링(ffSampling)이 지배한다(비율 미확인). 검증은 NTT 한 번
    - key: slh-dsa
      label: SLH-DSA (SPHINCS+)
      load: 대수 연산이 없고 거의 모든 시간이 해시 호출(WOTS+·FORS·하이퍼트리)이다
    - key: stateful-hash
      label: XMSS·LMS (상태 있는 해시 서명)
      load: 해시 호출과 머클 트리 계산이 지배한다
    - key: hqc
      label: HQC
      load: 이진체 GF(2) 순환 벡터 곱(희소×밀집), 리드-솔로몬·리드-뮬러 연접 복호, SHAKE256. NTT 가 없다
    - key: mceliece
      label: Classic McEliece
      load: 이진 확장체 GF(2^m) 산술 — 키 생성의 큰 행렬 가우스 소거, 복호의 Berlekamp-Massey·근 찾기. NTT 가 없다
    - key: bike
      label: BIKE
      load: 이진 순환 다항식 곱과 비트 뒤집기 복호, SHAKE. NTT 가 없다
    - key: multivariate
      label: 다변수 서명 (UOV·MAYO)
      load: 작은 유한체(GF(16)·GF(256)) 위 이차식 평가·선형 방정식 풀이와 SHAKE 시드 확장
    - key: cross
      label: CROSS
      load: 작은 소수체 위 신드롬 계산과 씨앗·머클 트리 해시(SHAKE)
    - key: vole-mpcith
      label: VOLE·MPC-in-the-head 서명
      load: 씨앗 트리 확장·VOLE 변환과 대칭 프리미티브(AES·해시) 호출이 많다
    - key: lattice-other
      label: 기타 격자 (Saber·NTRU KEM·FrodoKEM 등)
      load: 방식마다 다르다 — Saber·NTRU 는 NTT 아닌 다항식 곱, FrodoKEM 은 큰 정수 행렬 곱
    - key: classical-pk
      label: 고전 공개키 (RSA·ECC 등)
      load: 큰 정수 모듈러 곱·거듭제곱 또는 타원곡선 점 연산 — PQC 와 함께 평가한 편만 싣는다
    - key: kernel
      label: 방식 무관 연산
      load: 특정 방식 없이 NTT 같은 연산 하나를 가속한 논문
    ops:
    - key: ntt
      label: NTT
    - key: polymul
      label: NTT 아닌 다항식 곱
    - key: hash
      label: 해시·해시 트리
    - key: sampling
      label: 샘플링·난수
    - key: fft
      label: 부동소수 FFT·가우스 샘플링
    - key: blockcipher
      label: 블록 암호
    - key: linalg
      label: 행렬·선형대수
    - key: decode
      label: 부호 복호·신드롬
    - key: field
      label: 유한체·모듈러 산술
    - key: full
      label: 전체 연산 흐름
  zkp:
    schemes:
    - key: groth16
      label: Groth16
      load: MSM 이 GPU 구현 실행 시간의 70% 이상, 그다음 R1CS 희소 행렬-벡터 곱·NTT (cuZK, TCHES 2023, Figure 1). MSM 을 가속한 뒤에는 NTT 가 증명 지연의 최대 90% (ZKProphet, IISWC 2025)
      pq: 'no'
      pq_basis: 쌍선형 사상(페어링) 기반 약정
    - key: plonk
      label: PLONK (KZG 약정)
      load: NTT 와 MSM 두 연산이 계산 비용의 86.4% 이상 (Pipelonk, PPoPP 2026 §1). 메모리가 수백 GB 에 이르러 GPU 용량을 넘는다
      pq: 'no'
      pq_basis: KZG 약정(쌍선형 사상)
    - key: plonkish-fri
      label: Plonkish + FRI (Plonky2)
      load: MSM 이 없다. 증인 생성·NTT·저차 확장·Poseidon 머클 트리로 시간이 흩어지고, 메모리는 저차 확장 값이 지배한다 (MegaZK, ICS 2026)
      pq: plausible
      pq_basis: 해시 기반 약정(FRI)
    - key: sumcheck-hash
      label: 합 검사 + 해시 약정 (Orion·Brakedown 계열)
      load: MSM·NTT 가 없다. 합 검사·머클 트리(SHA-256)·선형 시간 부호화(희소 행렬-벡터 곱)가 부하다 (BatchZK, ASPLOS 2025). 합 검사는 큰 표를 반복해 읽고 쓰는 메모리 대역폭 병목이다 (zkSpeed, ISCA 2025 Table 1 — 합 검사 라운드의 산술 강도 0.04~0.22 대 MSM 7.83~8.70)
      pq: plausible
      pq_basis: 해시(머클 트리)·부호 기반 약정
    - key: binius
      label: 이진체 탑 (Binius)
      load: 약정(리드-솔로몬 부호화·머클 트리)과 합 검사가 증명자 계산을 지배한다. 이진체 곱셈은 GPU 에 전용 명령이 없다 (DATE 2026, Fan 외)
      pq: plausible
      pq_basis: 해시 기반 약정
    - key: gkr-hyrax
      label: GKR·합 검사 + Hyrax 약정 (zkML)
      load: 텐서 연산을 합 검사로 증명하고 약정에 타원곡선 MSM 을 쓴다. 단계별 비율은 확인하지 못했다
      pq: 'no'
      pq_basis: Hyrax 약정(이산 로그)
    - key: folding
      label: 폴딩 IVC (Nova 계열)
      load: 단계마다 증인 약정(MSM)과 교차항 계산을 한다. 단계별 비율은 확인하지 못했다
      pq: 'no'
      pq_basis: 이산 로그 기반 약정(격자 기반 폴딩 LatticeFold 는 예외)
    - key: bulletproofs
      label: Bulletproofs (내적 논증)
      load: 타원곡선 점 연산으로 된 내적 논증이 부하다. 단계별 비율은 확인하지 못했다
      pq: 'no'
      pq_basis: 이산 로그
    - key: kernel
      label: 체계 무관 단일 연산
      load: 특정 증명 체계를 정하지 않고 MSM·NTT 같은 연산 하나를 가속한 논문
      pq: depends
      pq_basis: 적용하는 체계에 따름
    ops:
    - key: msm
      label: MSM
    - key: ntt
      label: NTT·저차 확장
    - key: sumcheck
      label: 합 검사
    - key: hash
      label: 해시·머클 트리
    - key: spmv
      label: 희소 행렬-벡터 곱
    - key: witness
      label: 증인 생성
    - key: field
      label: 유한체 산술
    - key: ipa
      label: 내적 논증
  fhe:
    schemes:
    - key: ckks
      label: CKKS
      load: 소수 여러 개로 나눈 RNS 표현의 NTT·원소별 곱, 키 전환(분해→기저 올림→내적→기저 내림)·재조정·회전, 부트스트래핑이 핫 경로다
    - key: bfv-bgv
      label: BFV·BGV
      load: CKKS 와 같은 RNS 다항식 산술에 곱마다 빠른 기저 변환·스케일 내림·재선형화가 든다
    - key: tfhe
      label: TFHE·FHEW
      load: 블라인드 회전(누산기를 n 번 외부곱으로 갱신)이 핫 경로다 — 가젯 분해·NTT/FFT 다항식 곱, 샘플 추출·키 전환. RNS 기저 변환은 핫 경로가 아니다
    - key: switching
      label: 방식 전환
      load: 두 방식의 부하를 함께 갖고, 방식 사이 변환(추출·재포장) 비용이 더해진다
    - key: partial
      label: 부분 동형 (Paillier 등)
      load: 큰 정수 모듈러 곱·거듭제곱이 전부다
    - key: other
      label: 기타 동형 방식
      load: NTRU 기반 등 위 분류 밖의 방식
    - key: kernel
      label: 방식 무관 연산
      load: 특정 방식 없이 NTT 같은 연산 하나를 가속한 논문
    ops:
    - key: ntt
      label: NTT
    - key: polymul
      label: NTT 아닌 다항식 곱
    - key: keyswitch
      label: 키 전환·회전
    - key: bootstrap
      label: 부트스트래핑
    - key: basis
      label: RNS 기저 변환·모듈러 연산
    - key: fft
      label: 부동소수 FFT
    - key: linear
      label: 동형 행렬 곱·선형 변환
    - key: bigint
      label: 큰 정수 모듈러 연산
    - key: app
      label: 동형 응용(추론·DB 등)
sys_opts:
- key: multi-gpu
  label: 다중 GPU 분할
  desc: 한 작업을 여러 GPU 에 나눠 실행
- key: multi-node
  label: 다중 노드 분산
  desc: 여러 서버(노드)에 작업을 나누고 결과를 모음
- key: cpu-gpu
  label: CPU-GPU 분담
  desc: 일부 단계를 CPU 가 맡아 GPU 와 동시에 처리
- key: overlap
  label: 전송·계산 겹치기
  desc: 여러 CUDA 스트림 등으로 호스트-장치 전송이나 GPU 간 통신을 계산과 겹침
- key: out-of-core
  label: GPU 메모리 초과 처리
  desc: 입력을 조각으로 나눠 GPU 메모리보다 큰 문제를 처리(장치 밖 실행·분할 실행)
- key: memory
  label: 메모리 절감
  desc: 중간값을 제자리에서 계산하거나 순서를 바꿔 최대 메모리 사용량을 줄임
- key: resident
  label: GPU 상주·전송 제거
  desc: 모든 단계를 GPU 에서 돌려 중간 결과의 왕복 전송을 없앰
- key: pipeline
  label: 단계 간 파이프라인
  desc: 증명 단계·라운드·여러 증명을 겹쳐 흘려 보냄
- key: batch
  label: 묶음 처리
  desc: 여러 건(증명·서명·키 교환·암호문)을 묶어 처리해 처리량을 높임
- key: fusion
  label: 커널 융합
  desc: 여러 커널을 하나로 합쳐 전역 메모리 왕복을 줄임
- key: tuning
  label: 매개변수 자동 선택
  desc: 비용 모델이나 실측으로 창 크기·분할 크기 등을 고름
- key: hw-unit
  label: 특수 연산 장치 활용
  desc: 텐서 코어·부동소수 장치처럼 원래 다른 용도인 GPU 장치를 암호 연산에 씀
- key: concurrent
  label: 독립 커널 동시 실행
  desc: 서로 독립인 커널을 여러 CUDA 스트림에 띄워 동시에 실행
- key: compiler
  label: 컴파일러·코드 생성
  desc: 컴파일러·코드 생성기·스케줄러가 최적화를 자동 적용
- key: hw-ext
  label: GPU 구조 확장 제안
  desc: GPU 에 새 장치·명령을 더하는 하드웨어 확장을 제안하고 시뮬레이터로 평가
- key: precompute
  label: 미리 계산
  desc: 요청과 무관한 부분(고정 키 전개·키 생성 등)을 미리 또는 뒤에서 계산해 둠
