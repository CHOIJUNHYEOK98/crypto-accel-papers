# ZKP 논문의 증명 체계 계열(systems)과 가속 연산(ops) 이름표.
# papers.yml 의 zkp_system·zkp_ops 칸은 여기 key 만 쓴다.
# load: 그 계열 증명 생성에서 시간을 많이 쓰는 연산(근거 논문과 함께). 비율을 확인하지 못한 계열은 그렇다고 적는다.
systems:
  - key: groth16
    label: Groth16
    load: "MSM 이 GPU 구현 실행 시간의 70% 이상, 그다음 R1CS 희소 행렬-벡터 곱·NTT (cuZK, TCHES 2023, Figure 1). MSM 을 가속한 뒤에는 NTT 가 증명 지연의 최대 90% (ZKProphet, IISWC 2025)"
  - key: plonk
    label: PLONK (KZG 약정)
    load: "NTT 와 MSM 두 연산이 계산 비용의 86.4% 이상 (Pipelonk, PPoPP 2026 §1). 메모리가 수백 GB 에 이르러 GPU 용량을 넘는다"
  - key: plonkish-fri
    label: Plonkish + FRI (Plonky2)
    load: "MSM 이 없다. 증인 생성·NTT·저차 확장·Poseidon 머클 트리로 시간이 흩어지고, 메모리는 저차 확장 값이 지배한다 (MegaZK, ICS 2026)"
  - key: sumcheck-hash
    label: 합 검사 + 해시 약정 (Orion·Brakedown 계열)
    load: "MSM·NTT 가 없다. 합 검사·머클 트리(SHA-256)·선형 시간 부호화(희소 행렬-벡터 곱)가 부하다 (BatchZK, ASPLOS 2025). 합 검사는 큰 표를 반복해 읽고 쓰는 메모리 대역폭 병목이다 (zkSpeed, ISCA 2025 Table 1 — 합 검사 라운드의 산술 강도 0.04~0.22 대 MSM 7.83~8.70)"
  - key: binius
    label: 이진체 탑 (Binius)
    load: "약정(리드-솔로몬 부호화·머클 트리)과 합 검사가 증명자 계산을 지배한다. 이진체 곱셈은 GPU 에 전용 명령이 없다 (DATE 2026, Fan 외)"
  - key: gkr-hyrax
    label: GKR·합 검사 + Hyrax 약정 (zkML)
    load: "텐서 연산을 합 검사로 증명하고 약정에 타원곡선 MSM 을 쓴다. 단계별 비율은 확인하지 못했다"
  - key: folding
    label: 폴딩 IVC (Nova 계열)
    load: "단계마다 증인 약정(MSM)과 교차항 계산을 한다. 단계별 비율은 확인하지 못했다"
  - key: bulletproofs
    label: Bulletproofs (내적 논증)
    load: "타원곡선 점 연산으로 된 내적 논증이 부하다. 단계별 비율은 확인하지 못했다"
  - key: kernel
    label: 체계 무관 단일 연산
    load: "특정 증명 체계를 정하지 않고 MSM·NTT 같은 연산 하나를 가속한 논문"
ops:
  - {key: msm, label: MSM}
  - {key: ntt, label: NTT·저차 확장}
  - {key: sumcheck, label: 합 검사}
  - {key: hash, label: 해시·머클 트리}
  - {key: spmv, label: 희소 행렬-벡터 곱}
  - {key: witness, label: 증인 생성}
  - {key: field, label: 유한체 산술}
  - {key: ipa, label: 내적 논증}
  - {key: e2e, label: 전체 흐름·메모리·전송}
